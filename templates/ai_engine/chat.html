{% extends 'base.html' %}

{% block title %}AI Chat | NForge{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="card-title">Ask about {{ paper.title }}</h2>
        <form method="post" class="mt-3">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label" for="question">Question</label>
                <input class="form-control" id="question" name="question" placeholder="What is this paper about?" required>
            </div>
            <button class="btn btn-primary" type="submit">Ask AI</button>
        </form>

        {% if answer %}
            <div class="alert alert-info mt-4 mb-0">{{ answer }}</div>
        {% endif %}
    </div>
</div>
{% endblock %}
