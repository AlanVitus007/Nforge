{% extends 'base.html' %}

{% block title %}Register | NForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">Create Account</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Register</button>
                </form>
                <p class="mt-3 mb-0"><a href="{% url 'login' %}">Already have an account?</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
