{% extends 'base.html' %}

{% block title %}New Project | NForge{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="card-title mb-4">New Project</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button class="btn btn-primary" type="submit">Save Project</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
