{% extends 'base.html' %}

{% block title %}Delete Project | NForge{% endblock %}

{% block content %}
<div class="card shadow-sm">
    <div class="card-body">
        <h2 class="card-title">Delete Project</h2>
        <p>Are you sure you want to delete <strong>{{ project.title }}</strong>?</p>
        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Yes, delete</button>
            <a class="btn btn-outline-secondary" href="{% url 'project_detail' project.pk %}">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
